
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Task Manager</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>

<body >
<nav class="navbar navbar-dark bg-dark shadow-sm">

    <div class="container">

        <span class="navbar-brand fs-3 fw-bold">
            <i class="bi bi-check2-square"></i>
            Task Manager
        </span>

    </div>

</nav>
<div class="container py-5">

    <div class="text-center mb-5">

        <h1 class="display-5 fw-bold">
            Task Dashboard
        </h1>

        <p class="text-muted">
            Stay organized and never miss a deadline.
        </p>

    </div>

    <div class="card shadow-lg border-0 mb-5">

        <div class="card-body">

            <h4 class="mb-4">
                <i class="bi bi-plus-circle"></i>
                <span th:text="${task.id} == null ? 'Add New Task' : 'Update Task'"></span>
            </h4>

            <form
                    th:action="${task.id} == null ? @{/tasks/add} : @{/tasks/update/{id}(id=${task.id})}"
                    th:object="${task}"
                    method="post">

                <input type="hidden" th:field="*{id}" />

                <div class="row g-3">

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Title</label>
                        <input
                                type="text"
                                class="form-control"
                                placeholder="Enter task title"
                                th:field="*{title}"
                                required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Description</label>
                        <input
                                type="text"
                                class="form-control"
                                placeholder="Enter description"
                                th:field="*{description}">
                    </div>

                    <div class="col-md-2">
                        <label class="form-label fw-semibold">Status</label>
                        <select class="form-select" th:field="*{status}">
                            <option value="PENDING">Pending</option>
                            <option value="DONE">Done</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label fw-semibold">Due Date</label>
                        <input
                                type="date"
                                class="form-control"
                                th:field="*{dueDate}">
                    </div>

                    <div class="col-md-2 d-grid">
                        <label class="form-label">&nbsp;</label>

                        <button
                                type="submit"
                                class="btn btn-success w-100">

                            <i class="bi bi-check-circle"></i>

                            <span th:text="${task.id} == null ? 'Add Task' : 'Update Task'"></span>

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>


    <div class="card shadow border-0">

        <div class="card-body">

            <h4 class="mb-4">
                <i class="bi bi-list-task"></i>
                All Tasks
            </h4>

            <table class="table table-hover table-bordered align-middle text-center">

            <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Status</th>
                <th>Due Date</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="t : ${tasks}">
                <td th:text="${t.title}"></td>
                <td th:text="${t.description}"></td>
                <td>
                <span th:if="${t.status == 'DONE'}"
                class="badge bg-success">Done
                </span>
                    <span th:if="${t.status == 'PENDING'}"
                          class="badge bg-warning text-dark">
                        Pending
                    </span>
                </td>
                <td th:text="${t.dueDate}"></td>

                <td>
                    <a th:href="@{/tasks/edit/{id}(id=${t.id})}"
                       class="btn btn-outline-primary btn-sm"><i class="bi bi-pencil-square"></i> Edit</a>

                    <a th:href="@{/tasks/delete/{id}(id=${t.id})}"
                       class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i>Delete</a>
                </td>
            </tr>

            </tbody>

        </table>
        </div>
    </div>
</div>
<footer class="text-center mt-5 mb-3 text-muted">

    Developed by <strong>Yuvraj Kansa Banik</strong> |
    <a href="https://github.com/YuvrajKbanik"
       target="_blank"
       class="text-decoration-none">
        GitHub
    </a>

</footer>
</body>
</html>
