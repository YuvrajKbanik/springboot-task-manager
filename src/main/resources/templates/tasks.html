```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Task Manager</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>

<body class="container mt-4">

<h1 class="mb-3">Task Manager</h1>

<!-- Add / Edit Form -->
<form th:action="${task.id} == null ? @{/tasks/add} : @{/tasks/update/{id}(id=${task.id})}"
      th:object="${task}"
      method="post"
      class="mb-3">

    <input type="hidden" th:field="*{id}" />

    <div class="row mb-2">

        <div class="col">
            <input type="text"
                   class="form-control"
                   placeholder="Title"
                   th:field="*{title}"
                   required>
        </div>

        <div class="col">
            <input type="text"
                   class="form-control"
                   placeholder="Description"
                   th:field="*{description}">
        </div>

        <div class="col">
            <select class="form-select" th:field="*{status}">
                <option value="PENDING">PENDING</option>
                <option value="DONE">DONE</option>
            </select>
        </div>

        <div class="col">
            <input type="date"
                   class="form-control"
                   th:field="*{dueDate}">
        </div>

        <div class="col">
            <button type="submit" class="btn btn-primary">
                <span th:text="${task.id} == null ? 'Add' : 'Update'"></span>
            </button>
        </div>

    </div>
</form>


<!-- Task Table -->
<table class="table table-striped">

    <thead>
    <tr>
        <th>Title</th>
        <th>Description</th>
        <th>Status</th>
        <th>Due Date</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="t : ${tasks}">
        <td th:text="${t.title}"></td>
        <td th:text="${t.description}"></td>
        <td th:text="${t.status}"></td>
        <td th:text="${t.dueDate}"></td>

        <td>
            <a th:href="@{/tasks/edit/{id}(id=${t.id})}"
               class="btn btn-warning btn-sm">Edit</a>

            <a th:href="@{/tasks/delete/{id}(id=${t.id})}"
               class="btn btn-danger btn-sm">Delete</a>
        </td>
    </tr>

    </tbody>

</table>

</body>
</html>
```
