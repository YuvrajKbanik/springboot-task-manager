<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="text-center mb-4">

                        Register

                    </h3>

                    <form
                            th:action="@{/register}"
                            th:object="${user}"
                            method="post">

                        <div class="mb-3">

                            <label>Username</label>

                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{username}"
                                    required>

                        </div>

                        <div class="mb-3">

                            <label>Email</label>

                            <input
                                    type="email"
                                    class="form-control"
                                    th:field="*{email}"
                                    required>

                        </div>

                        <div class="mb-3">

                            <label>Password</label>

                            <input
                                    type="password"
                                    class="form-control"
                                    th:field="*{password}"
                                    required>

                        </div>

                        <button
                                class="btn btn-success w-100">

                            Register

                        </button>

                    </form>

                    <p
                            class="text-danger mt-3"
                            th:text="${error}"></p>

                    <hr>

                    <a
                            th:href="@{/login}"
                            class="btn btn-secondary w-100">

                        Back to Login

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
